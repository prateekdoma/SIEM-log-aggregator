# SIEM Log Aggregator — docker-compose
#
# Pin the Compose project name so image and default container names are `siem-*`
# (otherwise they take the folder name, siem-claude-setup).
name: siem
#
# Block 1 (Lab + scripts) defines only the attack-lab services below.
# Later build-order blocks append kafka, postgres, producers, normalizer,
# intel-updater, detector, storage-writer and api to this same file.
#
# The lab network is `internal: true` (SPEC hard rule 7 / 8): no route to the
# internet, so attack tools can only ever reach other lab containers.

networks:
  lab:
    internal: true          # no internet route; only the attack lab lives here
  siem:                     # pipeline backbone (kafka, postgres, python services)

volumes:
  ssh_logs:   # target-ssh writes sshd logs here; producer-ssh tails them later
  web_logs:   # target-web (nginx) writes its access log here; producer-web tails it
  pgdata:     # postgres data (wiped by `make reset` = down -v)

services:
  # --- SSH target -----------------------------------------------------------
  # `admin` has the weak password and is the brute-force target. Normal users
  # (strong passwords) are created by the init script for traffic-gen to use.
  target-ssh:
    image: linuxserver/openssh-server:latest
    container_name: siem-target-ssh
    hostname: target-ssh
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      PASSWORD_ACCESS: "true"
      USER_NAME: ${SSH_ADMIN_USER}
      USER_PASSWORD: ${SSH_ADMIN_PASS}
      # Extra accounts for traffic-gen, consumed by the init script below.
      NORMAL_USERS: ${SSH_NORMAL_USERS}
      NORMAL_PASSWORD: ${SSH_NORMAL_PASS}
      # Log to a file (not stdout) so producer-ssh can tail it from the volume.
      LOG_STDOUT: "false"
    volumes:
      - ssh_logs:/config/logs/openssh
      - ./lab/target-ssh/init-users.sh:/custom-cont-init.d/10-normal-users.sh:ro
    networks:
      - lab
    restart: unless-stopped

  # --- Vulnerable web app and its database ----------------------------------
  dvwa-db:
    image: mariadb:10.11
    container_name: siem-dvwa-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DVWA_DB_ROOT_PASS}
      MYSQL_DATABASE: dvwa
      MYSQL_USER: dvwa
      MYSQL_PASSWORD: ${DVWA_DB_PASS}
    networks:
      - lab
    restart: unless-stopped

  dvwa:
    image: ghcr.io/digininja/dvwa:latest
    container_name: siem-dvwa
    depends_on:
      - dvwa-db
    environment:
      DB_SERVER: dvwa-db
      DB_DATABASE: dvwa
      DB_USERNAME: dvwa
      DB_PASSWORD: ${DVWA_DB_PASS}
    networks:
      - lab
    restart: unless-stopped

  # --- Reverse proxy in front of DVWA; writes the combined access log -------
  target-web:
    image: nginx:alpine
    container_name: siem-target-web
    depends_on:
      - dvwa
    # The nginx:alpine image ships access.log as a symlink to /dev/stdout.
    # Remove it so nginx writes a REAL file on the shared volume that
    # producer-web can tail (block 2). error.log can stay on stderr.
    command:
      - sh
      - -c
      - "rm -f /var/log/nginx/access.log && exec nginx -g 'daemon off;'"
    volumes:
      - ./lab/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - web_logs:/var/log/nginx
    networks:
      - lab
    restart: unless-stopped

  # --- Normal background traffic (SSH logins + page views) ------------------
  traffic-gen:
    build: ./lab/traffic-gen
    container_name: siem-traffic-gen
    depends_on:
      - target-ssh
      - target-web
    environment:
      SSH_HOST: target-ssh
      SSH_PORT: "2222"
      WEB_URL: http://target-web
      SSH_NORMAL_USERS: ${SSH_NORMAL_USERS}
      SSH_NORMAL_PASS: ${SSH_NORMAL_PASS}
    networks:
      - lab
    restart: unless-stopped

  # --- On-demand attacker ---------------------------------------------------
  # Runs one scenario per `docker compose exec attacker attack <scenario>`.
  # ATTACK_INTERVAL_MIN > 0 also loops A1-A3 on a timer (default 0 = off).
  attacker:
    build: ./lab/attacker
    container_name: siem-attacker
    depends_on:
      - target-ssh
      - target-web
    environment:
      SSH_HOST: target-ssh
      SSH_PORT: "2222"
      SSH_ADMIN_USER: ${SSH_ADMIN_USER}
      SSH_ADMIN_PASS: ${SSH_ADMIN_PASS}
      ATTACK_INTERVAL_MIN: ${ATTACK_INTERVAL_MIN}
    networks:
      - lab
    restart: unless-stopped

  # ==========================================================================
  # Block 2 — Pipeline core: Kafka, Postgres, producers, normalizer, storage
  # ==========================================================================

  # --- Kafka broker (KRaft, single node) ------------------------------------
  kafka:
    image: apache/kafka:3.9.0
    container_name: siem-kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      # No accidental 1-partition topics; only kafka-init creates topics.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Retention (SPEC "Storage and retention"): 2 h / 100 MB, 16 MB segments.
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS}
      KAFKA_LOG_RETENTION_BYTES: ${KAFKA_LOG_RETENTION_BYTES}
      KAFKA_LOG_SEGMENT_BYTES: ${KAFKA_LOG_SEGMENT_BYTES}
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    networks:
      - siem
    restart: unless-stopped

  # --- One-shot topic creation ----------------------------------------------
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: siem-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for t in syslog-raw web-logs-raw normalized-security-events security-alerts; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 \
            --create --if-not-exists --topic "$$t" \
            --partitions 3 --replication-factor 1
        done
        echo "topics ready:"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    networks:
      - siem
    restart: "no"

  # --- Postgres -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: siem-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - siem
    restart: unless-stopped

  # --- Producers: tail lab log files into the raw topics --------------------
  producer-ssh:
    build:
      context: .
      dockerfile: producers/Dockerfile
    container_name: siem-producer-ssh
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    command: ["--source", "ssh", "--file", "/logs/ssh/current", "--topic", "syslog-raw"]
    volumes:
      - ssh_logs:/logs/ssh:ro
    networks:
      - siem
    restart: unless-stopped

  producer-web:
    build:
      context: .
      dockerfile: producers/Dockerfile
    container_name: siem-producer-web
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    command: ["--source", "web", "--file", "/logs/web/access.log", "--topic", "web-logs-raw"]
    volumes:
      - web_logs:/logs/web:ro
    networks:
      - siem
    restart: unless-stopped

  # --- Normalizer (2 replicas share the raw partitions) ---------------------
  normalizer:
    build:
      context: .
      dockerfile: normalizer/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    deploy:
      replicas: 2
    networks:
      - siem
    restart: unless-stopped

  # --- Storage writer: normalized events + alerts -> Postgres ---------------
  storage-writer:
    build:
      context: .
      dockerfile: storage/Dockerfile
    container_name: siem-storage-writer
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - siem
    restart: unless-stopped
